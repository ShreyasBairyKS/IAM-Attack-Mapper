[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-attack-mapper"
version = "0.1.0"
description = "AWS IAM privilege-escalation path mapper: a BloodHound-style graph of who can escalate to admin, and how."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Shreyas", email = "shreyasbairyks@gmail.com" },
]
keywords = [
    "aws", "iam", "security", "cloud-security", "privilege-escalation",
    "attack-path", "security-audit", "devsecops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "networkx>=3.0",
    "click>=8.0",
]

[project.urls]
Homepage = "https://github.com/ShreyasBairyKS/IAM-Attack-Mapper"
Repository = "https://github.com/ShreyasBairyKS/IAM-Attack-Mapper"
Issues = "https://github.com/ShreyasBairyKS/IAM-Attack-Mapper/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
aws = [
    "boto3>=1.28",
]

[project.scripts]
iam-mapper = "iam_mapper.cli:main"

[tool.setuptools.packages.find]
include = ["iam_mapper*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
