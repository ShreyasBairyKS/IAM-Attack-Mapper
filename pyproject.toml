[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-attack-mapper"
version = "0.1.0"
description = "AWS IAM privilege-escalation path mapper: a BloodHound-style graph of who can escalate to admin, and how."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "networkx>=3.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
aws = [
    "boto3>=1.28",
]

[project.scripts]
iam-mapper = "iam_mapper.cli:main"

[tool.setuptools.packages.find]
include = ["iam_mapper*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
