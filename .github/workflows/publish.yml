name: Publish to PyPI

# Triggered by publishing a GitHub Release (a deliberate, human-initiated
# action) -- not by every tag push. Uses PyPI's Trusted Publisher (OIDC)
# flow, so no API token is stored in this repo; see the one-time setup
# note below.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/iam-attack-mapper
    permissions:
      id-token: write  # required for Trusted Publisher OIDC -- no PYPI_API_TOKEN needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
